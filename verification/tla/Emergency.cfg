\* TLC configuration for CommitmentStateMachine.tla: EMERGENCY JUSTIFICATION.
\* Two signals, s1's evidence depending on s2, the decision fixed as
\* irreversible, no exits or reclassification, and off-envelope and
\* containment reviews that may open, be resolved, or be suspended by an
\* Emergency Justification; a log of at most 10 records.
CONSTANTS
    Signals = {s1, s2}
    MaxLog = 10
    DeclaredInit = {"irreversible"}
    ReversalInit = {FALSE}
    Reclassify = FALSE
    UpFrom = s1
    UpTo = s2
    CycleBack = FALSE
    Exits = FALSE
    EnvTriggers = {"off_envelope", "containment"}

SPECIFICATION Spec

INVARIANTS
    TypeOK
    Rule4
    LowerClassNeedsReversal
    CycleNeverSound
    SoundAllTheWayUp
    EnvReviewHoldsTheLoop

PROPERTIES
    NoCloseBeforeClassified
    NoCloseBeforeReview
    NoSilentCloseFromSuppressed
    NoSilentReopen
    EscalatedNeedsModelUpdate
    EscalatedNeverClosesDirectly
    TrajectoryLockTerminal
    ExecutedOpenTerminal
    NoForbiddenReentry
    NoWaitingReentryWithoutCondition
    NoLegalReentryWithoutResumableSubtype
    AuditAppendOnly
    EveryChangeLogged
    OpenLoopExecutionLogged
    NoOpenLoopAfterIrreversibleExecution
    OverrideNeverLocks
    ExternalExitKeptAtExecution
    NoIrreversibleExecutionPastReview
    SuspendableReviewNeedsEJ
    EJSuspendsWithoutResolving
    EJOpensPostEventReview
    NoCleanPassOverAuthorityClosure
    NoCleanPassOverNonResolvingExit
    NoLowerClassExecutionWithoutReversal
    RelabelAfterRefusalEscalates
    NoExecutionWhileRelabelOpen
    ReclassificationLogged
    ChainWeakeningLogged
    NoCleanPassOverBrokenChain

CHECK_DEADLOCK FALSE
