\* TLC configuration for CommitmentStateMachine.tla
\* Two signals and a log of at most 8 records. Raise MaxLog for a deeper
\* (slower) search; the properties do not depend on the bound.
CONSTANTS
    Signals = {s1, s2}
    MaxLog = 8

SPECIFICATION Spec

INVARIANTS
    TypeOK
    Rule4

PROPERTIES
    NoCloseBeforeClassified
    NoCloseBeforeReview
    NoSilentCloseFromSuppressed
    NoSilentReopen
    EscalatedNeedsModelUpdate
    EscalatedNeverClosesDirectly
    TrajectoryLockTerminal
    NoForbiddenReentry
    NoLegalReentryWithoutResumableSubtype
    AuditAppendOnly
    EveryChangeLogged
    OpenLoopExecutionLogged
    OverrideLatchesReviews

CHECK_DEADLOCK FALSE
