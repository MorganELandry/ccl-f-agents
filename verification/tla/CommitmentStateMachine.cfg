\* TLC configuration for CommitmentStateMachine.tla: THE SIGNAL LIFECYCLE.
\* Two signals and a log of at most 8 records, with the decision fixed as
\* irreversible and no reclassification (Classes.cfg explores those).
\* Raise MaxLog for a deeper (slower) search.
CONSTANTS
    Signals = {s1, s2}
    MaxLog = 8
    DeclaredInit = {"irreversible"}
    ReversalInit = {FALSE}
    Reclassify = FALSE
    UpFrom = s1
    UpTo = s2
    CycleBack = FALSE
    Exits = TRUE

SPECIFICATION Spec

INVARIANTS
    TypeOK
    Rule4
    LowerClassNeedsReversal
    CycleNeverSound
    SoundAllTheWayUp

PROPERTIES
    NoCloseBeforeClassified
    NoCloseBeforeReview
    NoSilentCloseFromSuppressed
    NoSilentReopen
    EscalatedNeedsModelUpdate
    EscalatedNeverClosesDirectly
    TrajectoryLockTerminal
    NoForbiddenReentry
    NoWaitingReentryWithoutCondition
    NoLegalReentryWithoutResumableSubtype
    AuditAppendOnly
    EveryChangeLogged
    OpenLoopExecutionLogged
    OverrideLatchesReviews
    NoCleanPassOverAuthorityClosure
    NoLowerClassExecutionWithoutReversal
    RelabelAfterRefusalEscalates
    NoExecutionWhileRelabelOpen
    ReclassificationLogged
    ChainWeakeningLogged
    NoCleanPassOverBrokenChain

CHECK_DEADLOCK FALSE
