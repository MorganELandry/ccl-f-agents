\* TLC configuration for CommitmentStateMachine.tla: EXECUTION CLASSES.
\* One signal and a log of at most 7 records; the decision may be
\* registered at any class, with or without a tested reversal path, and may
\* be refused, relabeled and reviewed in any order.
CONSTANTS
    Signals = {s1}
    MaxLog = 7
    DeclaredInit = {"routine", "elevated", "irreversible"}
    ReversalInit = {FALSE, TRUE}
    Reclassify = TRUE
    UpFrom = nobody
    UpTo = nobody
    CycleBack = FALSE
    Exits = TRUE

SPECIFICATION Spec

INVARIANTS
    TypeOK
    Rule4
    LowerClassNeedsReversal
    CycleNeverSound
    SoundAllTheWayUp

PROPERTIES
    NoCloseBeforeClassified
    NoCloseBeforeReview
    NoSilentCloseFromSuppressed
    NoSilentReopen
    EscalatedNeedsModelUpdate
    EscalatedNeverClosesDirectly
    TrajectoryLockTerminal
    NoForbiddenReentry
    NoWaitingReentryWithoutCondition
    NoLegalReentryWithoutResumableSubtype
    AuditAppendOnly
    EveryChangeLogged
    OpenLoopExecutionLogged
    OverrideLatchesReviews
    NoIrreversibleExecutionPastReview
    NoCleanPassOverAuthorityClosure
    NoLowerClassExecutionWithoutReversal
    RelabelAfterRefusalEscalates
    NoExecutionWhileRelabelOpen
    ReclassificationLogged
    ChainWeakeningLogged
    NoCleanPassOverBrokenChain

CHECK_DEADLOCK FALSE
