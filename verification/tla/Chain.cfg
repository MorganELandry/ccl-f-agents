\* TLC configuration for CommitmentStateMachine.tla: CLOSURE CHAIN DEPTH.
\* Two signals, s1's evidence depending on s2, no exits, and a log of up to
\* 12 records: deep enough to close both by evidence, reopen s2, and see
\* s1's closure lose its standing.
CONSTANTS
    Signals = {s1, s2}
    MaxLog = 12
    DeclaredInit = {"irreversible"}
    ReversalInit = {FALSE}
    Reclassify = FALSE
    UpFrom = s1
    UpTo = s2
    CycleBack = FALSE
    Exits = FALSE

SPECIFICATION Spec

INVARIANTS
    TypeOK
    Rule4
    LowerClassNeedsReversal
    CycleNeverSound
    SoundAllTheWayUp

PROPERTIES
    NoCloseBeforeClassified
    NoCloseBeforeReview
    NoSilentCloseFromSuppressed
    NoSilentReopen
    EscalatedNeedsModelUpdate
    EscalatedNeverClosesDirectly
    TrajectoryLockTerminal
    NoForbiddenReentry
    NoWaitingReentryWithoutCondition
    NoLegalReentryWithoutResumableSubtype
    AuditAppendOnly
    EveryChangeLogged
    OpenLoopExecutionLogged
    OverrideLatchesReviews
    NoCleanPassOverAuthorityClosure
    NoLowerClassExecutionWithoutReversal
    RelabelAfterRefusalEscalates
    NoExecutionWhileRelabelOpen
    ReclassificationLogged
    ChainWeakeningLogged
    NoCleanPassOverBrokenChain

CHECK_DEADLOCK FALSE
